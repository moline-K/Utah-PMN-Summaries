name: agenda_downloader
services:
  pmn_generator:
    build: .
    working_dir: /workspace
    entrypoint: ["python", "app/generate_pmn_sources.py"]
    volumes:
      - .:/workspace

  agenda_downloader:
    build: .
    command: python /app/agenda_downloader.py
    env_file:
      - .env
    environment:
      - PMN_CONFIG_PATH=/app/pmn_sources.yaml
      - DB_PATH=${DB_PATH:-/data/utah_pmn.db}
    volumes:
      - ./data:/data
      - type: bind
        source: ./pmn_sources.yaml
        target: /app/pmn_sources.yaml
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  agenda_summarizer:
    build: .
    command: python /app/run_summarizer.py
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PMN_CONFIG_PATH=/app/pmn_sources.yaml
      - TEAMS_FLOW_WEBHOOK_URL=${TEAMS_FLOW_WEBHOOK_URL}
      - DB_PATH=${DB_PATH:-/data/utah_pmn.db}
      - PROMPT_TEMPLATE_PATH=${PROMPT_TEMPLATE_PATH:-/app/prompt_template.default.txt}
    volumes:
      - ./data:/data
      - type: bind
        source: ./pmn_sources.yaml
        target: /app/pmn_sources.yaml
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
