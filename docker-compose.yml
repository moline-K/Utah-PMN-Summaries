name: agenda_downloader
services:
  agenda_downloader:
    build: .
    command: python /app/agenda_downloader.py
    env_file:
      - .env
    environment:
      - PMN_CONFIG_PATH=/app/pmn_sources.yaml
      - DB_PATH=${DB_PATH:-/data/utah_pmn.db}
    volumes:
      - ./data:/data
      - ./pmn_sources.yaml:/app/pmn_sources.yaml:ro
    restart: unless-stopped

  agenda_summarizer:
    build: .
    command: python /app/run_summarizer.py
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PMN_CONFIG_PATH=/app/pmn_sources.yaml
      - TEAMS_CHANNELS_CONFIG_PATH=/app/MS_Teams_channels.yaml
      - DB_PATH=${DB_PATH:-/data/utah_pmn.db}
      - PROMPT_TEMPLATE_PATH=${PROMPT_TEMPLATE_PATH:-/app/prompt_template.default.txt}
    volumes:
      - ./data:/data
      - ./pmn_sources.yaml:/app/pmn_sources.yaml:ro
      - ./MS_Teams_channels.yaml:/app/MS_Teams_channels.yaml:ro
    restart: unless-stopped
